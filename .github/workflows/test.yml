name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  STIX_URL: https://raw.githubusercontent.com/mitre/cti/master/enterprise-attack/enterprise-attack.json

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The STIX bundle is ~48MB and gitignored - cached across runs since
      # it changes rarely. The cache key is the upstream file's ETag
      # (a HEAD request, no download), so a new ATT&CK release misses
      # the cache and is downloaded. Until 2026-11-26 the key was a fixed
      # string, so CI kept testing whichever bundle it cached first.
      # The step fails if no ETag comes back rather than reuse a stale key.
      - name: Get STIX bundle version (ETag)
        id: stix-etag
        run: |
          etag=$(curl -sSfI "$STIX_URL" | tr -d '\r' \
            | awk 'tolower($1)=="etag:" {gsub(/"/, "", $2); print $2}')
          test -n "$etag"
          echo "etag=$etag" >> "$GITHUB_OUTPUT"

      - name: Cache MITRE ATT&CK STIX bundle
        id: stix-cache
        uses: actions/cache@v4
        with:
          path: data/raw/enterprise-attack.json
          key: stix-bundle-enterprise-attack-${{ steps.stix-etag.outputs.etag }}

      - name: Download MITRE ATT&CK STIX bundle
        if: steps.stix-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p data/raw
          curl -sSf -o data/raw/enterprise-attack.json "$STIX_URL"

      # Rebuilds data/structural_graph.json and data/graph_with_semantics.json
      # from scratch, same as the README's Quick Start - this is what
      # actually catches the graph pipeline breaking, not just that the
      # committed JSON snapshots happen to still parse.
      - name: Build structural graph
        run: python -m graph.build_graph

      - name: Add semantic edges
        run: python -m graph.semantic_edges

      # The API and Docker image serve the COMMITTED JSON, not this
      # rebuild. Warn (do not fail: an ATT&CK release would turn every
      # unrelated PR red) when the rebuild differs from what is committed,
      # so a stale snapshot shows up on the run instead of going unnoticed.
      - name: Check committed graph snapshot is current
        run: |
          git diff --stat --exit-code -- data/ \
            || echo "::warning::Committed data/*.json differs from a fresh rebuild - regenerate and commit it."

      # No ANTHROPIC_API_KEY/OPENAI_API_KEY secrets are configured for
      # this repo at this stage, and data/test_logs/ is never fetched
      # here - so the EVTX cross-check tests and the adversarial LLM
      # tests both skip cleanly (pytest.mark.skipif, not a failure) per
      # their existing design (see tests/*.py). This job intentionally
      # runs only the deterministic, free, no-network-beyond-the-STIX-
      # bundle tests; a green run here can be all-skips for those two
      # files and that's expected, not a gap to "fix" by adding secrets.
      - name: Run test suite
        run: python -m pytest tests/ -v
